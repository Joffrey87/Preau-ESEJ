ans-serif" font-size="12" font-weight="700" fill="#14213d" text-anchor="middle">14,80</text><line x1="30" y1="135" x2="790" y2="135" stroke="#e6dfce" stroke-width="1"/><text x="52" y="151" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="start">Lecture</text><text x="250" y="151" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="middle">15,00</text><rect x="290" y="137" width="490" height="24" rx="5" fill="#ffffff" stroke="#e6dfce" stroke-width="1"/><text x="300" y="153" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14213d" text-anchor="start">Lit avec aisance et plaisir.</text><line x1="30" y1="165" x2="790" y2="165" stroke="#e6dfce" stroke-width="1"/><text x="52" y="181" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="start">Grammaire</text><text x="250" y="181" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="middle">14,60</text><rect x="290" y="167" width="490" height="24" rx="5" fill="#ffffff" stroke="#e6dfce" stroke-width="1"/><text x="300" y="183" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14213d" text-anchor="start">Bonnes bases, à consolider.</text><rect x="30" y="195" width="760" height="22" rx="3" fill="#f3e6c9"/><text x="40" y="211" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213d" text-anchor="start">Matières complémentaires</text><text x="250" y="211" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213d" text-anchor="middle">16,00</text><line x1="30" y1="225" x2="790" y2="225" stroke="#e6dfce" stroke-width="1"/><text x="52" y="241" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="start">Anglais</text><text x="250" y="241" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="middle">16,00</text><rect x="290" y="227" width="490" height="24" rx="5" fill="#ffffff" stroke="#e6dfce" stroke-width="1"/><text x="300" y="243" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14213d" text-anchor="start">Very good work! Louise participe volontiers.</text><rect x="30" y="255" width="760" height="22" rx="3" fill="#f3e6c9"/><text x="40" y="271" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213d" text-anchor="start">Catéchisme</text><text x="250" y="271" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213d" text-anchor="middle"></text><line x1="30" y1="285" x2="790" y2="285" stroke="#e6dfce" stroke-width="1"/><text x="52" y="301" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="start">Catéchisme</text><text x="250" y="301" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#14213d" text-anchor="middle"></text><rect x="290" y="287" width="490" height="24" rx="5" fill="#ffffff" stroke="#e6dfce" stroke-width="1"/><text x="300" y="303" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14213d" text-anchor="start">Louise participe avec joie et attention aux séances.</text><rect x="220" y="100" width="60" height="90" rx="8" fill="none" stroke="#c8952f" stroke-width="2" stroke-dasharray="5 3"/><circle cx="282" cy="102" r="13" fill="#c8952f" stroke="#fff" stroke-width="2"/><text x="282" y="107" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="282" y="133" width="506" height="